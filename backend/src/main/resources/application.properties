spring.application.name=buildtrack-backend
server.port=8080

# MongoDB (same database the Node/Mongoose version used; you can point this
# at a fresh database instead if you'd rather not share data between the
# two backend implementations)
spring.data.mongodb.uri=mongodb://localhost:27017/buildtrack

# JWT
# IMPORTANT: change this in production. Must be long/random enough for HS256
# (32+ bytes). Generate one with: openssl rand -base64 48
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG_1234567890
app.jwt.expiration-ms=604800000
# 604800000 ms = 7 days, matching the previous backend's JWT_EXPIRE=7d

# File uploads (site photos) — served at /uploads/**, stored in this folder
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS - the Vite dev server origin
app.cors.allowed-origin=http://localhost:5173

# Demo data seeding (equivalent of `node seed.js`) - disabled by default.
# Enable temporarily to (re)seed demo users + projects, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--app.seed.enabled=true
app.seed.enabled=false

